name: MVP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite:
    name: MVP databases, CLI, Skill and package
    strategy:
      matrix:
        node: ["22.16.0", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVALME_SETUP_PG_PORT: "5432"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mvp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: cmp package-lock.json npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
